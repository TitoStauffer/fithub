# Tema de login do FitHub (DEV-0026). Herda as telas do keycloak.v2 e muda só aparência e textos:
# nenhuma página é sobrescrita, então correções de segurança das telas do Keycloak continuam valendo.
parent=keycloak.v2
import=common/keycloak

# styles.css é do tema pai; fithub.css vem depois e aplica as cores e a tipografia do FitHub.
styles=css/styles.css css/fithub.css

# Um só esquema de cores por enquanto, igual ao da web.
darkMode=false
locales=pt-BR
