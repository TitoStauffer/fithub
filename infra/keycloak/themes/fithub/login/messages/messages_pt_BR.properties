# Textos do FitHub nas telas de login (DEV-0026). Só o que difere do pt-BR padrão do Keycloak.
loginTitle=Entrar no FitHub
loginTitleHtml=FitHub
loginAccountTitle=Entrar na sua conta
registerTitle=Criar conta no FitHub
emailForgotTitle=Recuperar senha
emailVerifyTitle=Confirme seu e-mail

# O login é por e-mail; a mensagem de erro é a mesma para e-mail inexistente e senha errada.
usernameOrEmail=E-mail
invalidUserMessage=E-mail ou senha inválidos.

# O cadastro não confirma que um e-mail já tem conta: orienta os dois caminhos possíveis.
emailExistsMessage=Não foi possível criar a conta com esse e-mail. Se você já tem conta, entre ou recupere a senha.
usernameExistsMessage=Não foi possível criar a conta com esse e-mail. Se você já tem conta, entre ou recupere a senha.

# A recuperação responde igual, exista ou não a conta.
emailSentMessage=Se houver uma conta com esse e-mail, você vai receber uma mensagem com as instruções.

# O login é só por e-mail: sem menção a nome de usuário.
email=E-mail
emailInstruction=Digite seu e-mail e enviaremos as instruções para criar uma nova senha.
backToLogin=Voltar para o login

# Com a verificação de e-mail ligada, o Keycloak pede a senha depois de confirmar o e-mail: a mesma
# tela serve para a conta nova e para a recuperação de senha.
updatePasswordTitle=Definir senha
updatePasswordMessage=Defina uma senha para acessar sua conta.
