# Borda do ambiente local (DEV-0181, docker-compose.app.yml): as rotas do Traefik de produção (infra/traefik/dynamic.yml),
# sem TLS e num endereço só. Só para desenvolvimento.

# Porta de cada serviço no container (SERVER_PORT padrão do application.yml).
map $api_service $api_port {
    account 8081;
    client 8082;
    training 8083;
    nutrition 8084;
}

server {
    listen 8000;
    server_name _;
    server_tokens off;
    # Fotos de evolução e de refeição sobem direto para o S3, pela URL pré-assinada.
    client_max_body_size 20m;

    # O Host original segue para os serviços: a URL pré-assinada das fotos é assinada com ele, e o Keycloak monta os
    # endereços a partir do hostname configurado.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # Resolve os nomes do compose a cada pedido, para a borda subir antes de um serviço e voltar a achá-lo depois de
    # um restart.
    resolver 127.0.0.11 valid=10s;

    # As APIs, sem o prefixo, como o strip-api-* do Traefik.
    location ~ ^/api/(account|client|training|nutrition)(/.*)?$ {
        set $api_service $1;
        set $rest $2;
        if ($rest = "") {
            set $rest /;
        }
        proxy_pass http://$api_service-service:$api_port$rest$is_args$args;
    }

    # O Keycloak fica na raiz do container; aqui ele aparece em /auth, como em produção, e só com o realm fithub e os
    # recursos das telas (Code Review do PR #361). O console de administração e o realm master ficam fora da borda,
    # que pode estar aberta na rede local: o console abre só no PC (docker-compose.app.yml).
    location ~ ^/auth/(realms/fithub/|resources/) {
        set $keycloak keycloak:8080;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://$keycloak;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location /auth/ {
        return 404;
    }

    # Buckets das fotos (URL pré-assinada).
    location ~ ^/(fithub-photos|fithub-meal-photos)/ {
        set $seaweedfs seaweedfs:8333;
        proxy_pass http://$seaweedfs;
    }

    location / {
        set $web web:8080;
        proxy_pass http://$web;
    }
}
