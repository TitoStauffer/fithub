# Infraestrutura local do FitHub (DEV-0012). Sobe com um comando, a partir da raiz:
#   docker compose -f infra/compose/docker-compose.dev.yml up -d --wait
# Valores padrão são só de desenvolvimento; para trocar, copie .env.example para .env
# nesta pasta. Portas publicadas só em 127.0.0.1.
name: fithub-dev

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Um banco e um usuário por serviço, mais o do Keycloak (postgres/init-databases.sh).
      FITHUB_DATABASES: account client training nutrition keycloak
      FITHUB_DB_PASSWORD: ${FITHUB_DB_PASSWORD:-fithub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.8-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fithub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fithub}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Importa o realm fithub versionado (DEV-0024) quando ele ainda não existe no banco.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${FITHUB_DB_PASSWORD:-fithub}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Secret do client fithub-account-service, lido pelo import do realm (DEV-0029). Só de desenvolvimento.
      FITHUB_ACCOUNT_SERVICE_SECRET: ${FITHUB_ACCOUNT_SERVICE_SECRET:-fithub-dev-account-service}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ../keycloak/realm-fithub.json:/opt/keycloak/data/import/realm-fithub.json:ro
      # Tema das telas de login e dos e-mails (DEV-0026).
      - ../keycloak/themes/fithub:/opt/keycloak/themes/fithub:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A imagem não traz curl: o health fica na porta de gestão (9000), lido via /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Storage S3 compatível (ADR-006): o MinIO deixou de publicar a imagem comunitária.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: server -s3 -dir=/data -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-fithub-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-fithub-dev-secret}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Observabilidade (DEV-0109, ADR-013): coletor OpenTelemetry, Loki, Tempo, Prometheus e Grafana num
  # container só. Fica no perfil "observability" (a imagem tem 2,8 GB); sobe com
  #   docker compose -f infra/compose/docker-compose.dev.yml --profile observability up -d --wait
  # O coletor lê os logs JSON que os serviços escrevem em .logs/ (na raiz) e recebe os spans por OTLP.
  # Grafana em http://localhost:3000, sem login: só para desenvolvimento local.
  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ../observability/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      # Painel das métricas de sucesso do PRD (DEV-0113).
      - ../observability/grafana/fithub-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/fithub.yaml:ro
      - ../observability/grafana/fithub-metricas.json:/otel-lgtm/fithub-metricas.json:ro
      - ../../.logs:/var/log/fithub:ro
    healthcheck:
      # A imagem grava /tmp/ready quando todos os componentes estão de pé.
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
