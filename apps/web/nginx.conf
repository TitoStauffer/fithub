# Estáticos da web em produção (DEV-0176), atrás do Traefik, que faz o TLS e os cabeçalhos de segurança (ADR-014).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Caminhos das APIs, do Keycloak e dos buckets que o Traefik não mandou para os serviços (o console de
    # administração e o realm master, por exemplo): 404, nunca o index do app.
    location ~ ^/(api|auth|fithub-photos|fithub-meal-photos)(/|$) {
        return 404;
    }

    # Os arquivos com hash no nome mudam a cada build: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rotas do app (React Router): qualquer caminho sem arquivo volta para o index, que nunca fica em cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
