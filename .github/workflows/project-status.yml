name: Project status

# Mantém o quadro "FitHub MVP" sincronizado com o trabalho (AGENTS.md, "Quadro e status"):
#   issue aberta                    → adiciona ao quadro em Backlog
#   branch feature|fix|chore/DEV-*  → issue em Em andamento
#   PR em rascunho                  → Em andamento
#   PR aberto / pronto p/ revisão   → Em revisão (e o autor vira responsável pelo PR)
#   Code Review pede ajustes        → Em andamento
#   PR mergeado                     → Feito (a issue fecha pelo "Closes #N")
#
# Projetos de conta pessoal não aceitam o GITHUB_TOKEN: as mudanças no quadro usam
# o secret PROJECT_TOKEN (PAT clássico com escopo "project"). Sem ele, o job só
# avisa e não falha.

on:
  issues:
    types: [opened]
  create:
  pull_request_target: # zizmor: ignore[dangerous-triggers] — roda o workflow confiável da master; nunca faz checkout nem executa código do PR.
    branches: [master]
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar quadro
    # create só interessa para branches; reviews só quando pedem ajustes.
    if: >-
      (github.event_name != 'create' || github.event.ref_type == 'branch') &&
      (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      # Sem checkout: nada do repositório, do PR ou da issue é executado.
      - name: Atualizar quadro
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CREATED_REF: ${{ github.event.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"; name="${REPO##*/}"

          # Responsável automático do PR (não depende do PROJECT_TOKEN).
          if [[ "${EVENT}" == "pull_request_target" && "${ACTION}" == "opened" && "${PR_AUTHOR_TYPE}" == "User" ]]; then
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/assignees" -f "assignees[]=${PR_AUTHOR}" > /dev/null \
              && echo "PR #${PR_NUMBER} atribuído a ${PR_AUTHOR}."
          fi

          # Decide coluna e issues afetadas.
          column=""; issues=""
          linked_issues() {
            gh api graphql \
              -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){closingIssuesReferences(first:10){nodes{number}}}}}' \
              -f o="${owner}" -f n="${name}" -F p="$1" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number'
          }
          case "${EVENT}" in
            issues)
              column="Backlog"; issues="${ISSUE_NUMBER}" ;;
            create)
              if [[ "${CREATED_REF}" =~ ^(feature|fix|chore)/(DEV-[0-9]{4})(-|$) ]]; then
                key="${BASH_REMATCH[2]}"
                issues="$(gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
                  --jq ".[] | select(.pull_request == null) | select(.title | startswith(\"[${key}] - \")) | .number")"
                column="Em andamento"
              fi ;;
            pull_request_target)
              issues="$(linked_issues "${PR_NUMBER}")"
              case "${ACTION}" in
                closed) [[ "${PR_MERGED}" == "true" ]] && column="Feito" ;;
                converted_to_draft) column="Em andamento" ;;
                *) if [[ "${PR_DRAFT}" == "true" ]]; then column="Em andamento"; else column="Em revisão"; fi ;;
              esac ;;
            pull_request_review)
              issues="$(linked_issues "${PR_NUMBER}")"; column="Em andamento" ;;
          esac

          if [[ -z "${column}" || -z "${issues}" ]]; then
            echo "Nada a mover (coluna='${column}', issues='${issues//$'\n'/ }')."
            exit 0
          fi
          if [[ -z "${PROJECT_TOKEN}" ]]; then
            echo "::warning title=PROJECT_TOKEN ausente::Quadro não atualizado (${column} para #${issues//$'\n'/, #}). Configure o secret PROJECT_TOKEN."
            exit 0
          fi

          export GH_TOKEN="${PROJECT_TOKEN}"
          project="$(gh api graphql \
            -f query='query($l:String!,$n:Int!){user(login:$l){projectV2(number:$n){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}' \
            -f l="${owner}" -F n="${PROJECT_NUMBER}" --jq '.data.user.projectV2')"
          project_id="$(jq -r '.id' <<< "${project}")"
          field_id="$(jq -r '.field.id' <<< "${project}")"
          option_id="$(jq -r --arg c "${column}" '.field.options[] | select(.name == $c) | .id' <<< "${project}")"
          [[ -n "${option_id}" ]] || { echo "::error::Coluna '${column}' não existe no quadro."; exit 1; }

          for number in ${issues}; do
            content_id="$(gh api "repos/${REPO}/issues/${number}" --jq '.node_id')"
            # addProjectV2ItemById é idempotente: devolve o item existente se já estiver no quadro.
            item_id="$(gh api graphql \
              -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' \
              -f p="${project_id}" -f c="${content_id}" --jq '.data.addProjectV2ItemById.item.id')"
            gh api graphql \
              -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
              -f p="${project_id}" -f i="${item_id}" -f f="${field_id}" -f o="${option_id}" > /dev/null
            echo "#${number} → ${column}"
          done
