name: Issue key

# Dá a toda issue nova a próxima chave sequencial: "[DEV-NNNN] - <título>".
# Regras em AGENTS.md, seção "Chave da tarefa".

on:
  issues:
    types: [opened]
  # Reparo manual: mesma varredura, sem precisar abrir issue.
  workflow_dispatch:

permissions: {}

# Uma execução por vez no repositório inteiro: duas issues abertas ao mesmo
# tempo nunca recebem a mesma chave.
#
# O GitHub mantém no máximo UMA execução pendente por grupo: se várias issues
# forem abertas juntas, pendentes intermediárias são canceladas (DEV-0120).
# Por isso toda execução varre todas as issues abertas sem chave, e não só a do
# evento: a execução que sobrevive cobre as canceladas.
concurrency:
  group: issue-key
  cancel-in-progress: false

jobs:
  assign-key:
    name: Atribuir chave DEV
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Não há checkout: o job não lê nem executa conteúdo do repositório ou da
      # issue. O título chega por variável de ambiente e só é tratado como texto.
      - name: Atribuir chave
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          key_pattern='^\[DEV-[0-9]{4}\] - '

          # Maior chave já usada em qualquer issue (aberta ou fechada; PRs ficam de fora).
          max_key() {
            gh api --paginate "repos/${REPO}/issues?state=all&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .title' \
              | grep -oE '^\[DEV-[0-9]{4}\]' | grep -oE '[0-9]{4}' | sort -n | tail -1 || true
          }

          assign() {
            local number="$1"
            local title
            title="$(gh api "repos/${REPO}/issues/${number}" --jq '.title')"
            if [[ "${title}" =~ ${key_pattern} ]]; then
              echo "#${number} já tem chave: ${title}"
              return 0
            fi
            # Remove uma chave malformada no início (ex.: "[DEV-12]" ou "DEV-12 -").
            local clean
            clean="$(printf '%s' "${title}" | sed -E 's/^\[?DEV-[0-9]+\]?[[:space:]]*-?[[:space:]]*//')"
            local last next key
            last="$(max_key)"
            next=$(( 10#${last:-0} + 1 ))
            key="$(printf 'DEV-%04d' "${next}")"
            jq -n --arg t "[${key}] - ${clean}" '{title: $t}' \
              | gh api --method PATCH "repos/${REPO}/issues/${number}" --input - --jq '.title'
            echo "#${number} recebeu ${key}"
          }

          # Todas as issues abertas sem chave, em ordem de criação (inclui a do evento).
          pending="$(gh api --paginate "repos/${REPO}/issues?state=open&sort=created&direction=asc&per_page=100" \
            --jq '.[] | select(.pull_request == null)
                  | select((.title | startswith("[DEV-")) and (.title[5:9] | test("^[0-9]{4}$")) and (.title[9:13] == "] - ") | not)
                  | .number')"
          echo "Evento ${EVENT} (issue ${ISSUE_NUMBER:-n/a}). Sem chave: ${pending//$'\n'/ }"
          for number in ${pending}; do assign "${number}"; done
