name: CI

# CI do FitHub (DEV-0016). Um job por área, e cada área só trabalha quando algo dela mudou:
#
#   Detect changes        decide as áreas (tools/repo-checks/ci-changes.mjs); push na master roda tudo
#   GitHub Reviewer       ferramentas de revisão, docs, hook e scripts do runner (sempre)
#   Java Services         libs Java e serviços: build, unitários, ArchUnit e integração (Testcontainers)
#   Apps                  workspace pnpm: lint, typecheck e testes dos apps e pacotes
#   Local Infrastructure  compose de desenvolvimento sobe saudável
#   Publish Images        só no push na master: imagem dos serviços alterados no GHCR (DEV-0017)
#
# GitHub Reviewer, Java Services, Apps e Local Infrastructure são checks exigidos pelos bots de orquestração (repository-policy.ts). Por isso
# eles sempre rodam e terminam com sucesso quando a área não mudou: o passo "Skip" registra isso, e
# os passos de verdade aparecem como pulados. Se "Detect changes" falhar ou não disser "false", os
# jobs ficam sem sucesso e o merge bloqueia. O nome "CI" e os dos jobs são lidos pelos bots: mude-os juntos.

on:
  pull_request:
    branches: [master]
    # Edição de título/corpo é validada pelo workflow "PR title".
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]

# Os jobs só leem o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.22.0"

defaults:
  run:
    # bash explícito liga -eo pipefail.
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      java: ${{ steps.detect.outputs.java }}
      apps: ${{ steps.detect.outputs.apps }}
      infra: ${{ steps.detect.outputs.infra }}
      services: ${{ steps.images.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A base e o HEAD do PR precisam estar no histórico para o diff.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect changed areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node tools/repo-checks/ci-changes.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            node tools/repo-checks/ci-changes.mjs --all >> "$GITHUB_OUTPUT"
          fi

      # Serviços cuja imagem muda (DEV-0017). No PR, pelo diff do PR; no push na master, pelo diff do
      # push. Sem um "before" utilizável (primeiro push, histórico reescrito), gera todas.
      - name: Detect changed service images
        id: images
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node tools/repo-checks/ci-changes.mjs --services "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            node tools/repo-checks/ci-changes.mjs --services "$BEFORE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            node tools/repo-checks/ci-changes.mjs --services --all >> "$GITHUB_OUTPUT"
          fi

  automation-tools:
    name: GitHub Reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/github-reviewer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico completo: o verificador de documentação confere o commit citado no docs/HISTORICO.md.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/github-reviewer/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-timeout=15000 --fetch-retries=1

      - name: Build and test GitHub integration tools
        run: npm test

      # Caminhos até 200 caracteres, links relativos dos .md e docs/HISTORICO.md (DEV-0010).
      - name: Check repository docs
        working-directory: .
        run: |
          node --test tools/repo-checks/check-docs.test.mjs
          node tools/repo-checks/check-docs.mjs

      # Detector de áreas e guarda de teste pulado usados pelos outros jobs (DEV-0016).
      - name: Test CI scripts
        working-directory: .
        run: node --test tools/repo-checks/ci-scripts.test.mjs

      - name: Test pre-push hook
        working-directory: .
        run: sh .githooks/test-pre-push.sh

      - name: Validate local runner scripts
        working-directory: .
        shell: pwsh
        run: ./tools/github-runner/test-runner-scripts.ps1

  java-services:
    name: Java Services
    needs: changes
    runs-on: ubuntu-24.04
    # mvn verify mais a imagem de cada serviço alterado (até quatro builds Maven dentro do Docker).
    timeout-minutes: 45
    env:
      RUN_AREA: ${{ needs.changes.outputs.java }}
    steps:
      - name: Skip (no Java changes)
        if: env.RUN_AREA != 'true'
        run: |
          [ "$RUN_AREA" = false ] || { echo "Saída do detector inválida: '$RUN_AREA'."; exit 1; }
          echo "Nenhuma mudança em pom.xml, libs/ ou services/; build e testes Java não rodam."

      - name: Checkout
        if: env.RUN_AREA == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        if: env.RUN_AREA == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Setup Node.js
        if: env.RUN_AREA == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Unitários, ArchUnit e integração com Testcontainers (Postgres e RabbitMQ); o enforcer do POM pai roda junto.
      - name: Build and test Java modules
        if: env.RUN_AREA == 'true'
        run: mvn -B -ntp verify

      - name: Check skipped tests
        if: env.RUN_AREA == 'true'
        run: node tools/repo-checks/check-skipped-tests.mjs libs services

      # No PR, a imagem de cada serviço alterado precisa construir e rodar sem root antes do merge
      # (DEV-0017); o push na master constrói de novo e publica no job Publish Images.
      - name: Build service images
        if: env.RUN_AREA == 'true' && github.event_name == 'pull_request'
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          images=()
          for service in $(jq -r '.[]' <<<"$SERVICES"); do
            [[ "$service" =~ ^[a-z0-9-]+$ ]] || { echo "Nome de serviço inválido: '$service'."; exit 1; }
            docker build --file "services/$service/Dockerfile" --tag "fithub-$service:ci" .
            images+=("fithub-$service:ci")
          done
          if [ "${#images[@]}" -gt 0 ]; then
            node tools/repo-checks/check-image-user.mjs "${images[@]}"
          else
            echo "Nenhuma imagem de serviço mudou neste PR."
          fi

  apps:
    name: Apps
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_AREA: ${{ needs.changes.outputs.apps }}
    steps:
      - name: Skip (no app changes)
        if: env.RUN_AREA != 'true'
        run: |
          [ "$RUN_AREA" = false ] || { echo "Saída do detector inválida: '$RUN_AREA'."; exit 1; }
          echo "Nenhuma mudança em apps/, packages/ ou no workspace pnpm; lint, typecheck e testes não rodam."

      - name: Checkout
        if: env.RUN_AREA == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: env.RUN_AREA == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        if: env.RUN_AREA == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Cada app ou pacote declara os próprios scripts lint, typecheck e test; quem não tem é pulado.
      - name: Lint
        if: env.RUN_AREA == 'true'
        run: pnpm -r --if-present run lint

      - name: Typecheck
        if: env.RUN_AREA == 'true'
        run: pnpm -r --if-present run typecheck

      - name: Test
        if: env.RUN_AREA == 'true'
        run: pnpm -r --if-present run test

      # Os testes dos apps publicam JUnit em reports/junit*.xml. --allow-none só enquanto não houver
      # app nem pacote com testes (DEV-0020 e DEV-0021 retiram a opção ao criar os apps).
      - name: Check skipped tests
        if: env.RUN_AREA == 'true'
        run: node tools/repo-checks/check-skipped-tests.mjs --allow-none apps packages

  local-infrastructure:
    name: Local Infrastructure
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_AREA: ${{ needs.changes.outputs.infra }}
    steps:
      - name: Skip (no infrastructure changes)
        if: env.RUN_AREA != 'true'
        run: |
          [ "$RUN_AREA" = false ] || { echo "Saída do detector inválida: '$RUN_AREA'."; exit 1; }
          echo "Nenhuma mudança em infra/; o compose de desenvolvimento não sobe."

      - name: Checkout
        if: env.RUN_AREA == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Infraestrutura local (DEV-0012): o compose sobe e todos os serviços ficam saudáveis.
      - name: Validate local infrastructure compose
        if: env.RUN_AREA == 'true'
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml up -d --wait --wait-timeout 300
          docker compose -f infra/compose/docker-compose.dev.yml ps

      - name: Stop local infrastructure compose
        if: always() && env.RUN_AREA == 'true'
        run: docker compose -f infra/compose/docker-compose.dev.yml down -v

  # Imagens no GHCR (DEV-0017): só no push na master, depois de o Java Services passar no mesmo
  # commit, e só para os serviços alterados. Tag = SHA do commit; deploy continua manual (ADR-005).
  publish-images:
    name: Publish Images
    needs: [changes, java-services]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Único job com escrita: publicar pacotes. Usa o GITHUB_TOKEN, sem secret extra.
    permissions:
      contents: read
      packages: write
    env:
      SERVICES: ${{ needs.changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build, check and push images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for service in $(jq -r '.[]' <<<"$SERVICES"); do
            [[ "$service" =~ ^[a-z0-9-]+$ ]] || { echo "Nome de serviço inválido: '$service'."; exit 1; }
            image="ghcr.io/$owner/fithub-$service:$GITHUB_SHA"
            docker build --file "services/$service/Dockerfile" --tag "$image" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" .
            node tools/repo-checks/check-image-user.mjs "$image"
            docker push "$image"
            echo "Publicada: $image"
          done

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
