name: CI

# CI do FitHub (DEV-0016). Um job por área, e cada área só trabalha quando algo dela mudou:
#
#   Detect changes        decide as áreas (tools/repo-checks/ci-changes.mjs); push na master roda tudo
#   GitHub Reviewer       ferramentas de revisão, docs, hook e scripts do runner (sempre)
#   Java Services         libs Java e serviços: build, unitários, ArchUnit e integração (Testcontainers)
#   Apps                  workspace pnpm: lint, typecheck e testes dos apps e pacotes
#   Local Infrastructure  compose de desenvolvimento sobe saudável
#   Publish Images        só no push na master: imagem de todos os serviços e da web no GHCR, tag do commit (DEV-0017, DEV-0176)
#
# Mutação (DEV-0116): os manifestos mutations/<CHAVE>.json alterados no PR rodam no job da área de cada
# mutante (tools no GitHub Reviewer, java no Java Services, apps no Apps), por tools/repo-checks/mutations.mjs.
#
# GitHub Reviewer, Java Services, Apps e Local Infrastructure são checks exigidos pelos bots de orquestração (repository-policy.ts). Por isso
# eles sempre rodam e terminam com sucesso quando a área não mudou: o passo "Skip" registra isso, e
# os passos de verdade aparecem como pulados. Se "Detect changes" falhar ou não disser "false", os
# jobs ficam sem sucesso e o merge bloqueia. O nome "CI" e os dos jobs são lidos pelos bots: mude-os juntos.

on:
  pull_request:
    branches: [master]
    # Edição de título/corpo é validada pelo workflow "PR title".
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]

# Os jobs só leem o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.22.0"

defaults:
  run:
    # bash explícito liga -eo pipefail.
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      java: ${{ steps.detect.outputs.java }}
      apps: ${{ steps.detect.outputs.apps }}
      infra: ${{ steps.detect.outputs.infra }}
      services: ${{ steps.images.outputs.services }}
      mutations: ${{ steps.detect.outputs.mutations }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A base e o HEAD do PR precisam estar no histórico para o diff.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect changed areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node tools/repo-checks/ci-changes.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            node tools/repo-checks/ci-changes.mjs --all >> "$GITHUB_OUTPUT"
          fi

      # Imagens de serviço (DEV-0017). No PR, só as dos serviços alterados, para validar o build antes do
      # merge. No push na master, todas: o grupo de concorrência guarda um único run pendente, então um
      # run cancelado ou falho deixaria o serviço daquele commit sem imagem se a escolha viesse do diff
      # do push (aprendizado concorrencia-pendente-cancelada). Com a tag pelo SHA, cada run é idempotente.
      - name: Detect service images
        id: images
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node tools/repo-checks/ci-changes.mjs --services "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            node tools/repo-checks/ci-changes.mjs --services --all >> "$GITHUB_OUTPUT"
          fi

  automation-tools:
    name: GitHub Reviewer
    # Depende do detector só para receber os manifestos de mutação (DEV-0116); detector falho deixa
    # este job sem sucesso, como os outros.
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/github-reviewer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico completo: o verificador de documentação confere o commit citado no docs/HISTORICO.md.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/github-reviewer/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-timeout=15000 --fetch-retries=1

      - name: Build and test GitHub integration tools
        run: npm test

      # Caminhos até 200 caracteres, links relativos dos .md e docs/HISTORICO.md (DEV-0010).
      - name: Check repository docs
        working-directory: .
        run: |
          node --test tools/repo-checks/check-docs.test.mjs
          node tools/repo-checks/check-docs.mjs

      # Detector de áreas e guarda de teste pulado usados pelos outros jobs (DEV-0016).
      - name: Test CI scripts
        working-directory: .
        run: node --test tools/repo-checks/ci-scripts.test.mjs tools/repo-checks/mutations.test.mjs

      # Mutantes declarados em mutations/<CHAVE>.json alterados no PR, área tools (DEV-0116).
      - name: Mutation (tools)
        working-directory: .
        env:
          MUTATIONS: ${{ needs.changes.outputs.mutations }}
        run: |
          # Atribuição separada: com bash -e, falha do jq derruba o passo em vez de virar lista vazia.
          manifests="$(jq -r '.[]' <<<"$MUTATIONS")"
          node tools/repo-checks/mutations.mjs --area tools $manifests

      - name: Test pre-push hook
        working-directory: .
        run: sh .githooks/test-pre-push.sh

      - name: Validate local runner scripts
        working-directory: .
        shell: pwsh
        run: ./tools/github-runner/test-runner-scripts.ps1

  java-services:
    name: Java Services
    needs: changes
    runs-on: ubuntu-24.04
    # mvn verify mais a imagem de cada serviço alterado (até quatro builds Maven dentro do Docker).
    timeout-minutes: 45
    env:
      RUN_AREA: ${{ needs.changes.outputs.java }}
    steps:
      - name: Skip (no Java changes)
        if: env.RUN_AREA != 'true'
        run: |
          [ "$RUN_AREA" = false ] || { echo "Saída do detector inválida: '$RUN_AREA'."; exit 1; }
          echo "Nenhuma mudança em pom.xml, libs/ ou services/; build e testes Java não rodam."

      - name: Checkout
        if: env.RUN_AREA == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico completo: o Spotless compara com a origin/master para conferir só os arquivos alterados.
          fetch-depth: 0

      - name: Setup Java
        if: env.RUN_AREA == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Setup Node.js
        if: env.RUN_AREA == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Padrão de código (DEV-0129): formatação dos arquivos alterados (Spotless) e regras do Checkstyle em tudo.
      - name: Code style (Java)
        if: env.RUN_AREA == 'true'
        run: mvn -B -ntp spotless:check checkstyle:check

      # Unitários, ArchUnit e integração com Testcontainers (Postgres e RabbitMQ); o enforcer do POM pai roda junto.
      - name: Build and test Java modules
        if: env.RUN_AREA == 'true'
        run: mvn -B -ntp verify

      - name: Check skipped tests
        if: env.RUN_AREA == 'true'
        run: node tools/repo-checks/check-skipped-tests.mjs libs services

      # Mutantes declarados da área java nos manifestos alterados no PR (DEV-0116).
      - name: Mutation (java)
        if: env.RUN_AREA == 'true'
        env:
          MUTATIONS: ${{ needs.changes.outputs.mutations }}
        run: |
          # Atribuição separada: com bash -e, falha do jq derruba o passo em vez de virar lista vazia.
          manifests="$(jq -r '.[]' <<<"$MUTATIONS")"
          node tools/repo-checks/mutations.mjs --area java $manifests

      # No PR, a imagem de cada serviço alterado precisa construir e rodar sem root antes do merge
      # (DEV-0017); o push na master constrói de novo e publica no job Publish Images.
      - name: Build service images
        if: env.RUN_AREA == 'true' && github.event_name == 'pull_request'
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          images=()
          for service in $(jq -r '.[]' <<<"$SERVICES"); do
            [[ "$service" =~ ^[a-z0-9-]+$ ]] || { echo "Nome de serviço inválido: '$service'."; exit 1; }
            # O repositório Maven que o mvn verify já preencheu vai para o estágio de build (DEV-0155): sem ele, cada
            # imagem baixava tudo do Maven Central de novo, e o Central às vezes respondia 429.
            docker build --build-context m2="$HOME/.m2/repository" \
              --file "services/$service/Dockerfile" --tag "fithub-$service:ci" .
            images+=("fithub-$service:ci")
          done
          if [ "${#images[@]}" -gt 0 ]; then
            node tools/repo-checks/check-image-user.mjs "${images[@]}"
          else
            echo "Nenhuma imagem de serviço mudou neste PR."
          fi

  apps:
    name: Apps
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_AREA: ${{ needs.changes.outputs.apps }}
    steps:
      - name: Skip (no app changes)
        if: env.RUN_AREA != 'true'
        run: |
          [ "$RUN_AREA" = false ] || { echo "Saída do detector inválida: '$RUN_AREA'."; exit 1; }
          echo "Nenhuma mudança em apps/, packages/ ou no workspace pnpm; lint, typecheck e testes não rodam."

      - name: Checkout
        if: env.RUN_AREA == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: env.RUN_AREA == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        if: env.RUN_AREA == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Cada app ou pacote declara os próprios scripts lint, typecheck, test e build; quem não tem é pulado.
      - name: Lint
        if: env.RUN_AREA == 'true'
        run: pnpm -r --if-present run lint

      - name: Typecheck
        if: env.RUN_AREA == 'true'
        run: pnpm -r --if-present run typecheck

      - name: Test
        if: env.RUN_AREA == 'true'
        run: pnpm -r --if-present run test

      - name: Build
        if: env.RUN_AREA == 'true'
        run: pnpm -r --if-present run build

      # Imagem da web (DEV-0176): no PR, constrói, roda sem root e serve o app (rota do React Router volta para o
      # index, sem cache); o push na master constrói de novo e publica no job Publish Images.
      - name: Build web image
        if: env.RUN_AREA == 'true' && github.event_name == 'pull_request'
        run: sh apps/web/image.test.sh

      # Os testes dos apps publicam JUnit em reports/junit*.xml (o web desde a DEV-0020); sem nenhum
      # relatório, a guarda falha. Teste pulado no Vitest precisa da issue no nome: it.skip('... DEV-xxxx').
      - name: Check skipped tests
        if: env.RUN_AREA == 'true'
        run: node tools/repo-checks/check-skipped-tests.mjs apps packages

      # Mutantes declarados da área apps nos manifestos alterados no PR (DEV-0116).
      - name: Mutation (apps)
        if: env.RUN_AREA == 'true'
        env:
          MUTATIONS: ${{ needs.changes.outputs.mutations }}
        run: |
          # Atribuição separada: com bash -e, falha do jq derruba o passo em vez de virar lista vazia.
          manifests="$(jq -r '.[]' <<<"$MUTATIONS")"
          node tools/repo-checks/mutations.mjs --area apps $manifests

  local-infrastructure:
    name: Local Infrastructure
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_AREA: ${{ needs.changes.outputs.infra }}
    steps:
      - name: Skip (no infrastructure changes)
        if: env.RUN_AREA != 'true'
        run: |
          [ "$RUN_AREA" = false ] || { echo "Saída do detector inválida: '$RUN_AREA'."; exit 1; }
          echo "Nenhuma mudança em infra/; o compose de desenvolvimento não sobe."

      - name: Checkout
        if: env.RUN_AREA == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: env.RUN_AREA == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Guardas do realm versionado (DEV-0024): clients só com Authorization Code + PKCE, papel padrão, senha.
      - name: Check Keycloak realm file
        if: env.RUN_AREA == 'true'
        run: node --test infra/keycloak/realm.test.mjs

      # Infraestrutura local (DEV-0012): o compose sobe e todos os serviços ficam saudáveis.
      - name: Validate local infrastructure compose
        if: env.RUN_AREA == 'true'
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml up -d --wait --wait-timeout 300
          docker compose -f infra/compose/docker-compose.dev.yml ps

      # O realm foi importado e o Keycloak de pé recusa o que não é Authorization Code + PKCE (DEV-0024). O cadastro
      # não pede senha, e o e-mail de verificação chega ao Mailpit com a moldura do tema fithub (DEV-0145).
      - name: Check imported Keycloak realm
        if: env.RUN_AREA == 'true'
        run: node infra/keycloak/check-live-realm.mjs http://localhost:8080 http://localhost:8025

      # Backup e restauração (DEV-0108): dumps por banco, retenção de 30 dias, recusa de backup incompleto e a
      # lista de contas excluídas preservada na restauração.
      - name: Check database backup and restore
        if: env.RUN_AREA == 'true'
        run: sh infra/backup/backup.test.sh

      # Observabilidade (DEV-0109): o otel-lgtm do perfil observability sobe com a configuração do coletor, e um span
      # e uma linha de log com o mesmo traceId chegam ao Tempo e ao Loki.
      - name: Check observability stack
        if: env.RUN_AREA == 'true'
        run: |
          mkdir -p .logs
          docker compose -f infra/compose/docker-compose.dev.yml --profile observability up -d --wait --wait-timeout 300 otel-lgtm
          sh infra/observability/observability.test.sh

      - name: Stop local infrastructure compose
        if: always() && env.RUN_AREA == 'true'
        run: docker compose -f infra/compose/docker-compose.dev.yml --profile observability down -v

      # Compose de produção (DEV-0110): guardas de portas, segredos, rotas, retenção e do workflow de deploy, e a
      # fumaça da borda (Traefik, Keycloak em modo de produção, S3, backup agendado e otel-lgtm), sem os serviços.
      - name: Check production compose guards
        if: env.RUN_AREA == 'true'
        run: node --test infra/compose/prod.test.mjs

      - name: Smoke test production compose
        if: env.RUN_AREA == 'true'
        run: sh infra/compose/prod-smoke.test.sh

  # Imagens no GHCR (DEV-0017): só no push na master, depois de o Java Services e o Apps passarem no mesmo
  # commit, para todos os serviços e a web (DEV-0176, idempotente). Tag = SHA do commit; deploy continua manual
  # (ADR-005).
  publish-images:
    name: Publish Images
    needs: [changes, java-services, apps]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Único job com escrita: publicar pacotes. Usa o GITHUB_TOKEN, sem secret extra.
    permissions:
      contents: read
      packages: write
    env:
      SERVICES: ${{ needs.changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build, check and push images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for service in $(jq -r '.[]' <<<"$SERVICES"); do
            [[ "$service" =~ ^[a-z0-9-]+$ ]] || { echo "Nome de serviço inválido: '$service'."; exit 1; }
            image="ghcr.io/$owner/fithub-$service:$GITHUB_SHA"
            docker build --file "services/$service/Dockerfile" --tag "$image" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" .
            node tools/repo-checks/check-image-user.mjs "$image"
            docker push "$image"
            echo "Publicada: $image"
          done
          # Web do profissional (DEV-0176): o deploy usa a mesma tag dos serviços.
          image="ghcr.io/$owner/fithub-web:$GITHUB_SHA"
          docker build --file apps/web/Dockerfile --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          node tools/repo-checks/check-image-user.mjs "$image"
          docker push "$image"
          echo "Publicada: $image"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
