name: CI

# CI do FitHub. Por enquanto só o job das ferramentas de revisão; os jobs dos
# serviços e apps entram na DEV-0016. O nome "CI" e o do job "GitHub Reviewer"
# são lidos pelos bots de orquestração (DEV-0118): mude os dois juntos.

on:
  pull_request:
    branches: [master]
    # Edição de título/corpo é validada pelo workflow "PR title".
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]

# Os jobs só leem o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.22.0"

defaults:
  run:
    # bash explícito liga -eo pipefail.
    shell: bash

jobs:
  automation-tools:
    name: GitHub Reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/github-reviewer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/github-reviewer/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-timeout=15000 --fetch-retries=1

      - name: Build and test GitHub integration tools
        run: npm test

      - name: Test pre-push hook
        working-directory: .
        run: sh .githooks/test-pre-push.sh

      - name: Validate local runner scripts
        working-directory: .
        shell: pwsh
        run: ./tools/github-runner/test-runner-scripts.ps1

      # Raiz do monorepo (DEV-0011): o POM pai e o workspace pnpm precisam resolver sem erro.
      # Fica neste job até a DEV-0016 criar os jobs próprios dos serviços e apps.
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Build e testes dos módulos Java (DEV-0013 em diante); o enforcer do POM pai roda junto.
      - name: Build and test Java modules
        working-directory: .
        run: mvn -B -ntp verify

      - name: Validate pnpm workspace
        working-directory: .
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Infraestrutura local (DEV-0012): o compose sobe e todos os serviços ficam saudáveis.
      - name: Validate local infrastructure compose
        working-directory: .
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml up -d --wait --wait-timeout 300
          docker compose -f infra/compose/docker-compose.dev.yml ps

      - name: Stop local infrastructure compose
        if: always()
        working-directory: .
        run: docker compose -f infra/compose/docker-compose.dev.yml down -v
