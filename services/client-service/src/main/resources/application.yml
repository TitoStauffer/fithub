# client-service (DEV-0015). Os padrões apontam para o compose de desenvolvimento (infra/compose);
# fora dele, tudo vem de variável de ambiente. As senhas padrão são só de desenvolvimento local.
spring:
  application:
    name: client-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:client}
    username: ${DB_USER:client}
    password: ${DB_PASSWORD:fithub}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é só das migrations (Flyway); o Hibernate apenas confere.
      ddl-auto: validate
  mail:
    # SMTP do convite por e-mail (DEV-0035): o Mailpit do compose por padrão.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fithub}
    password: ${RABBITMQ_PASSWORD:fithub}
    listener:
      simple:
        # Consumidores (DEV-0035): 3 tentativas; depois, a mensagem vai para a fila de mensagens mortas
        # da fila (<fila>.dlq) em vez de voltar para a fila sem fim.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fithub}

server:
  port: ${SERVER_PORT:8082}

management:
  health:
    mail:
      # O SMTP fora do ar não tira o serviço do ar: o convite vale sem o e-mail (DEV-0035).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fithub:
  messaging:
    # Exchange topic de origem dos eventos deste serviço (ADR-003).
    exchange: fithub.client
  invitations:
    # Início do link do convite; o token vai no fim. O app mobile abre o esquema fithub:// (DEV-0042).
    link-base: ${FITHUB_INVITATION_LINK_BASE:fithub://convite/}
  mail:
    from: ${FITHUB_MAIL_FROM:FitHub <nao-responda@fithub.local>}
  storage:
    # Fotos de evolução (DEV-0048): SeaweedFS do compose pela API S3. As credenciais padrão são só de
    # desenvolvimento local; fora dele, vêm de variável de ambiente.
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    # Endereço que o app usa nas URLs pré-assinadas (no aparelho, o IP da máquina).
    public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:8333}}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:fithub-dev}
    secret-key: ${S3_SECRET_KEY:fithub-dev-secret}
    bucket: ${S3_PHOTOS_BUCKET:fithub-photos}
