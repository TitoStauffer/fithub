# account-service (DEV-0015). Os padrões apontam para o compose de desenvolvimento (infra/compose);
# fora dele, tudo vem de variável de ambiente. As senhas padrão são só de desenvolvimento local.
spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:account}
    username: ${DB_USER:account}
    password: ${DB_PASSWORD:fithub}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é só das migrations (Flyway); o Hibernate apenas confere.
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fithub}
    password: ${RABBITMQ_PASSWORD:fithub}
    listener:
      simple:
        # Consumidor do ContaExcluida (DEV-0161): 3 tentativas; depois, a mensagem vai para a fila de
        # mensagens mortas (<fila>.dlq) em vez de voltar para a fila sem fim.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fithub}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fithub:
  security:
    # Os caminhos padrão da java-commons, mais o webhook do Asaas (DEV-0100), que confere o próprio token.
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /webhooks/asaas
  subscription:
    # Preço do plano mensal (DEV-0098, PRD seção 9.2). A data de corte do lançamento é provisória (o fim do beta):
    # quem assina até ela paga o preço de lançamento nos primeiros meses pagos.
    price:
      monthly: ${FITHUB_SUBSCRIPTION_PRICE:200.00}
      launch: ${FITHUB_SUBSCRIPTION_LAUNCH_PRICE:150.00}
      launch-months: ${FITHUB_SUBSCRIPTION_LAUNCH_MONTHS:3}
      launch-until: ${FITHUB_SUBSCRIPTION_LAUNCH_UNTIL:2027-06-30}
  payment:
    # Asaas (DEV-0100): sandbox por padrão. A chave e o token do webhook vêm só do ambiente; sem eles, o checkout falha
    # e o webhook recusa tudo.
    asaas:
      base-url: ${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
      api-key: ${ASAAS_API_KEY:}
      webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
      success-url: ${FITHUB_PAYMENT_SUCCESS_URL:http://localhost:5173/assinatura?retorno=sucesso}
      cancel-url: ${FITHUB_PAYMENT_CANCEL_URL:http://localhost:5173/assinatura?retorno=cancelado}
  messaging:
    # Exchange topic de origem dos eventos deste serviço (ADR-003).
    exchange: fithub.account
  # API de administração do Keycloak, para atribuir o papel de profissional (DEV-0029, ADR-008).
  # O secret padrão é o do compose local; fora dele vem de FITHUB_ACCOUNT_SERVICE_SECRET.
  keycloak-admin:
    base-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: fithub
    client-id: fithub-account-service
    client-secret: ${FITHUB_ACCOUNT_SERVICE_SECRET:fithub-dev-account-service}
  professional:
    role-retry:
      # Retentativa da atribuição de papel que falhou no cadastro.
      interval: 30s
