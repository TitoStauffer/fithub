# nutrition-service (DEV-0015). Os padrões apontam para o compose de desenvolvimento (infra/compose);
# fora dele, tudo vem de variável de ambiente. As senhas padrão são só de desenvolvimento local.
spring:
  application:
    name: nutrition-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nutrition}
    username: ${DB_USER:nutrition}
    password: ${DB_PASSWORD:fithub}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é só das migrations (Flyway); o Hibernate apenas confere.
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fithub}
    password: ${RABBITMQ_PASSWORD:fithub}
    listener:
      simple:
        # Consumidores (DEV-0151): 3 tentativas; depois, a mensagem vai para a fila de mensagens mortas
        # da fila (<fila>.dlq) em vez de voltar para a fila sem fim.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fithub}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fithub:
  storage:
    # Foto do prato (DEV-0088): SeaweedFS do compose pela API S3, como as fotos de evolução do client-service. As
    # credenciais padrão são só de desenvolvimento local; fora dele, vêm de variável de ambiente.
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    # Endereço que o app usa nas URLs pré-assinadas (no aparelho, o IP da máquina).
    public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:8333}}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:fithub-dev}
    secret-key: ${S3_SECRET_KEY:fithub-dev-secret}
    bucket: ${S3_MEAL_PHOTOS_BUCKET:fithub-meal-photos}
  messaging:
    # Exchange topic de origem dos eventos deste serviço (ADR-003).
    exchange: fithub.nutrition
  foods:
    # Importação da Tabela TACO (DEV-0075, ADR-011): desligada por padrão; liga com
    # FITHUB_FOODS_IMPORT_ENABLED=true e roda uma vez na subida do serviço.
    import:
      enabled: ${FITHUB_FOODS_IMPORT_ENABLED:false}
      resource: classpath:taco/taco-4a-edicao.csv
