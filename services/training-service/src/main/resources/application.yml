# training-service (DEV-0015). Os padrões apontam para o compose de desenvolvimento (infra/compose);
# fora dele, tudo vem de variável de ambiente. As senhas padrão são só de desenvolvimento local.
spring:
  application:
    name: training-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:training}
    username: ${DB_USER:training}
    password: ${DB_PASSWORD:fithub}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é só das migrations (Flyway); o Hibernate apenas confere.
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fithub}
    password: ${RABBITMQ_PASSWORD:fithub}
    listener:
      simple:
        # Consumidores (DEV-0039): 3 tentativas; depois, a mensagem vai para a fila de mensagens mortas
        # da fila (<fila>.dlq) em vez de voltar para a fila sem fim.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fithub}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fithub:
  messaging:
    # Exchange topic de origem dos eventos deste serviço (ADR-003).
    exchange: fithub.training
  exercises:
    # Importação da base do wger (DEV-0054, ADR-010): desligada por padrão; liga com
    # FITHUB_EXERCISES_IMPORT_ENABLED=true e roda uma vez na subida do serviço.
    import:
      enabled: ${FITHUB_EXERCISES_IMPORT_ENABLED:false}
      base-url: ${FITHUB_EXERCISES_IMPORT_BASE_URL:https://wger.de/api/v2}
      page-size: 100
      max-pages: 200
      timeout: 30s
